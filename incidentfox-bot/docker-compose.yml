services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=incidentfox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  incidentfox:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - PORT=8000

      # Database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/incidentfox

      # GitHub App (set these in .env file)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/keys/private-key.pem
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}

      # Coolify
      - COOLIFY_API_URL=${COOLIFY_API_URL}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}
      - COOLIFY_WEBHOOK_SECRET=${COOLIFY_WEBHOOK_SECRET}

      # LLM APIs
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Feature Flags
      - ENABLE_AUTO_FIX=false
      - ENABLE_ANTHROPIC=true
      - MAX_PATCH_FILES=5

      # Security
      - ALLOWED_FILE_PATTERNS=Dockerfile,docker-compose*.yml,.env.example,package*.json,requirements*.txt,*.config.js,*.config.ts,tsconfig.json,Makefile

    volumes:
      # Mount local directory for development
      - ./src:/app/src
      # Persistent database
      - incidentfox-data:/app/data
      # GitHub App private key
      - ./private-key.pem:/app/keys/private-key.pem:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    driver: local
  incidentfox-data:
    driver: local
