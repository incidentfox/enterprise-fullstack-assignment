services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The web app runs in the browser, so use host-exposed API port.
        - NEXT_PUBLIC_API_URL=http://localhost:5001
    platform: linux/amd64
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - '5001:5000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=app
      - PORT=5000
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    platform: linux/amd64
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
